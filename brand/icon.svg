<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Easy Code app icon: the mark of the interface canvas (AppLogo.vue) on the dark ground of the canvas
       ("Fundamentos visuais"). 824 px tile on a 1024 px canvas, the macOS icon grid. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2357"/>
      <stop offset="1" stop-color="#080B24"/>
    </linearGradient>
    <radialGradient id="glow-violet" cx="0.78" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="0.15" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ground)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow-violet)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow-blue)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#8C96FF" stroke-opacity="0.28" stroke-width="8"/>
  <g transform="translate(212 329.4) scale(6.52)">
    <path d="M22 4 6 28l16 24" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 4l16 24-16 24" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">0101</text>
    <text x="46" y="43" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="700">0010</text>
  </g>
</svg>
