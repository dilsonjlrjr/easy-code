# Installed stack of Easy Code (US-55, ADR-22). Use it through `make -C project install`, which:
#   1. writes install/.env with random passwords for the bundled PostgreSQL and Keycloak (first run only);
#   2. starts the bundled PostgreSQL and Keycloak (profile "bundled", on by default);
#   3. runs the installation wizard (profile "install") in the foreground until it locks;
#   4. starts the platform.
# The configuration the wizard writes lives in the volume easycode-config, mounted read-only by the
# platform services at /etc/easycode (EASYCODE_CONFIG_DIR). Each service picks its own database login
# with EASYCODE_DATABASE_URL_FILE; the rest comes from easycode.env.
#
# Not here yet (ADR-16): the reverse proxy with TLS and the egress proxy of the gateway. Put a TLS proxy in
# front of the web (8080) and of Keycloak (8180) before people outside this host use them; the realm
# refuses plain HTTP from public addresses (sslRequired: external).

name: easycode-platform

x-config: &config
  EASYCODE_CONFIG_DIR: /etc/easycode
  EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-info}

x-config-volume: &config-volume easycode-config:/etc/easycode:ro

services:
  # ---------------------------------------------------------------- bundled PostgreSQL and Keycloak
  postgres:
    image: postgres:17.6-bookworm
    profiles: [bundled]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EASYCODE_BUNDLED_POSTGRES_PASSWORD:?run make -C project install}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_PASSWORD: ${EASYCODE_BUNDLED_KEYCLOAK_DB_PASSWORD:?run make -C project install}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    profiles: [bundled]
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${EASYCODE_BUNDLED_KEYCLOAK_DB_PASSWORD:?run make -C project install}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${EASYCODE_BUNDLED_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${EASYCODE_BUNDLED_KEYCLOAK_ADMIN_PASSWORD:?run make -C project install}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${EASYCODE_SSO_PUBLIC_URL:-http://localhost:8180/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${EASYCODE_SSO_BIND:-127.0.0.1}:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15m
    restart: unless-stopped

  # ---------------------------------------------------------------- installation wizard (one time)
  installer:
    build:
      context: ..
      dockerfile: install/Dockerfile
      args:
        VERSION: ${EASYCODE_VERSION:-dev}
    image: easycode-installer:${EASYCODE_VERSION:-dev}
    profiles: [install]
    environment:
      EASYCODE_INSTALLER_ADDR: ":8080"
      EASYCODE_INSTALLER_PUBLIC_URL: ${EASYCODE_INSTALLER_PUBLIC_URL:-http://localhost:8090}
      EASYCODE_INSTALLER_BUNDLED: ${EASYCODE_BUNDLED:-true}
      # Prefill of the wizard with the bundled services; the person may change every value.
      EASYCODE_INSTALLER_DEFAULT_DATABASE_HOST: postgres
      EASYCODE_INSTALLER_DEFAULT_DATABASE_USER: postgres
      EASYCODE_INSTALLER_DEFAULT_DATABASE_PASSWORD: ${EASYCODE_BUNDLED_POSTGRES_PASSWORD:-}
      EASYCODE_INSTALLER_DEFAULT_SSO_PUBLIC_URL: ${EASYCODE_SSO_PUBLIC_URL:-http://localhost:8180/auth}
      EASYCODE_INSTALLER_DEFAULT_SSO_INTERNAL_URL: http://keycloak:8080/auth
      EASYCODE_INSTALLER_DEFAULT_SSO_ADMIN_USER: ${EASYCODE_BUNDLED_KEYCLOAK_ADMIN:-admin}
      EASYCODE_INSTALLER_DEFAULT_SSO_ADMIN_PASSWORD: ${EASYCODE_BUNDLED_KEYCLOAK_ADMIN_PASSWORD:-}
      EASYCODE_INSTALLER_DEFAULT_PUBLIC_ORIGIN: ${EASYCODE_PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - easycode-config:/etc/easycode
    ports:
      - "${EASYCODE_INSTALLER_BIND:-127.0.0.1}:8090:8080"

  # ---------------------------------------------------------------- platform
  migrate:
    build:
      context: ../backend
      args:
        BINARY: easycode-api
        VERSION: ${EASYCODE_VERSION:-dev}
    command: ["migrate"]
    environment:
      <<: *config
      EASYCODE_DATABASE_URL_FILE: /etc/easycode/secrets/migrator-database-url
      EASYCODE_MIGRATION_DATABASE_URL_FILE: /etc/easycode/secrets/migrator-database-url
    volumes:
      - *config-volume
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  gateway-keys:
    build:
      context: ../backend
      args:
        BINARY: easycode-gateway
        VERSION: ${EASYCODE_VERSION:-dev}
    command: ["keygen", "/run/easycode-gateway-key/private.pem", "/run/easycode-sealing/public.pem"]
    volumes:
      - gateway-key:/run/easycode-gateway-key
      - sealing-public:/run/easycode-sealing
    restart: "no"

  # Gives the repositories and files volumes to the platform user (65532) before api and worker start. The
  # image owner reaches a named volume only when it is empty on its first mount: a volume created by an older
  # stack stays owned by root and every wave fails at the commit (mkdir ... permission denied).
  volume-owner:
    image: postgres:17.6-bookworm
    user: "0:0"
    entrypoint: ["chown", "65532:65532", "/var/lib/easycode/repos", "/var/lib/easycode/files"]
    network_mode: none
    volumes:
      - repos:/var/lib/easycode/repos
      - files:/var/lib/easycode/files
    restart: "no"

  api:
    build:
      context: ../backend
      target: runtime-git
      args:
        BINARY: easycode-api
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      <<: *config
      EASYCODE_DATABASE_URL_FILE: /etc/easycode/secrets/api-database-url
      EASYCODE_HTTP_ADDR: ":8080"
      EASYCODE_GIT_BASE_URL: ${EASYCODE_GIT_BASE_URL:-http://localhost:8081}
      # Content origin of the prototypes (ADR-19, content.<domain>): own listener, no /api, no cookie. Behind
      # the TLS proxy it is https://content.<domain>; it must never be the web origin.
      EASYCODE_CONTENT_ADDR: ":8082"
      EASYCODE_CONTENT_ORIGIN: ${EASYCODE_CONTENT_ORIGIN:-http://127.0.0.1:8082}
      EASYCODE_SEALING_PUBLIC_KEY_FILE: /run/easycode-sealing/public.pem
    volumes:
      - *config-volume
      - sealing-public:/run/easycode-sealing:ro
      - repos:/var/lib/easycode/repos:ro
      - files:/var/lib/easycode/files
    depends_on:
      volume-owner:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      gateway-keys:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
        required: false
    ports:
      - "${EASYCODE_API_BIND:-127.0.0.1}:8081:8080"
      - "${EASYCODE_CONTENT_BIND:-127.0.0.1}:8082:8082"
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      target: runtime-git
      args:
        BINARY: easycode-worker
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      <<: *config
      EASYCODE_DATABASE_URL_FILE: /etc/easycode/secrets/worker-database-url
      EASYCODE_SANDBOX_IMAGE: go
    volumes:
      - *config-volume
      - gateway-socket:/run/easycode-gateway
      - sandbox-socket:/run/easycode-sandbox
      - agent-proxy:/run/easycode-agent-proxy
      - repos:/var/lib/easycode/repos
      - files:/var/lib/easycode/files:ro
    depends_on:
      volume-owner:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  sandbox-go-image:
    build:
      context: ../infra/sandbox/go
    image: easycode-sandbox-go:${EASYCODE_VERSION:-dev}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # Security scan image (US-23): Opengrep, Trivy and Gitleaks with their offline rules and database.
  sandbox-security-image:
    build:
      context: ../infra/sandbox/security
    image: easycode-sandbox-security:${EASYCODE_VERSION:-dev}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  sandbox:
    build:
      context: ../backend
      args:
        BINARY: easycode-sandbox
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-info}
      EASYCODE_SANDBOX_IMAGES: go=easycode-sandbox-go:${EASYCODE_VERSION:-dev},security=easycode-sandbox-security:${EASYCODE_VERSION:-dev}
      EASYCODE_SANDBOX_RUNTIME: runc
      EASYCODE_SANDBOX_DEPENDENCIES_NETWORK: easycode-platform-dependencies
      EASYCODE_SANDBOX_DEPENDENCIES_PROXY: http://deps-proxy:8080
      # Claude Code as the agent executor (ADR-23): host path of the binary, written by install.sh; empty = off.
      EASYCODE_CLAUDE_CODE_BIN: ${EASYCODE_CLAUDE_CODE_BIN:-}
      EASYCODE_AGENT_PROXY_VOLUME: easycode-platform-agent-proxy
    network_mode: none
    group_add:
      - "${EASYCODE_DOCKER_GID:-990}"
    volumes:
      - ${EASYCODE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - sandbox-socket:/run/easycode-sandbox
      - agent-proxy:/run/easycode-agent-proxy
    depends_on:
      sandbox-go-image:
        condition: service_completed_successfully
      sandbox-security-image:
        condition: service_completed_successfully
    restart: unless-stopped

  deps-proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      - ../infra/deps-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - deps-cache:/var/cache/nginx
    networks:
      - dependencies
      - deps-output
    restart: unless-stopped

  # Only process that opens provider keys (S-03). Without network it serves the deterministic fake under
  # the provider names; compose.providers.yaml gives it the real adapters (see install/README.md).
  gateway:
    build:
      context: ../backend
      args:
        BINARY: easycode-gateway
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-info}
      EASYCODE_GATEWAY_PROVIDERS: ${EASYCODE_GATEWAY_PROVIDERS:-anthropic=fake,openai=fake}
      EASYCODE_GATEWAY_PRIVATE_KEY_FILE: /run/easycode-gateway-key/private.pem
    network_mode: none
    volumes:
      - gateway-socket:/run/easycode-gateway
      - gateway-key:/run/easycode-gateway-key:ro
    depends_on:
      gateway-keys:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    environment:
      API_BASE_URL: /api/v1
      # ADR-19 / ER-11-2: the SPA frames only the content origin (Content-Security-Policy frame-src).
      EASYCODE_CONTENT_ORIGIN: ${EASYCODE_CONTENT_ORIGIN:-http://127.0.0.1:8082}
    depends_on:
      - api
    ports:
      - "${EASYCODE_WEB_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped

volumes:
  easycode-config:
  postgres-data:
  gateway-socket:
  gateway-key:
  sealing-public:
  sandbox-socket:
  # Wave model proxy sockets of the worker and the agent bridge (ADR-23); easycode-sandbox mounts its
  # subdirectories in the agent session containers by this name.
  agent-proxy:
    name: easycode-platform-agent-proxy
  repos:
  files:
  deps-cache:

networks:
  default: {}
  dependencies:
    name: easycode-platform-dependencies
    internal: true
  deps-output: {}
