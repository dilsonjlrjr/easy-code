<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Easy Code icon for 16 to 32 px (favicon, small app icons): the chevrons of the mark only, since the
       binary digits do not read at that size. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2357"/>
      <stop offset="1" stop-color="#080B24"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#ground)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#8C96FF" stroke-opacity="0.3"/>
  <path d="M24 14 12 32l12 18M40 14l12 18-12 18" fill="none" stroke="url(#mark)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 22v20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
