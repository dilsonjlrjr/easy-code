# deps-proxy of the development stack (ADR-07): the only exit of the dependency action of the sandbox.
# It caches the Go module proxy and the npm registry and refuses every other destination. Production
# points the same routes to the dependency proxy of the organization (vulnerability scan, S-14).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  proxy_cache_path /var/cache/nginx/deps levels=1:2 keys_zone=deps:10m max_size=5g inactive=30d use_temp_path=off;
  server {
    listen 8080;
    # GOPROXY=http://deps-proxy:8080/go (module proxy protocol; go.sum checks every hash)
    location /go/ {
      proxy_pass https://proxy.golang.org/;
      proxy_set_header Host proxy.golang.org;
      proxy_ssl_server_name on;
      proxy_cache deps;
      proxy_cache_valid 200 30d;
    }
    # npm_config_registry=http://deps-proxy:8080/npm/
    location /npm/ {
      proxy_pass https://registry.npmjs.org/;
      proxy_set_header Host registry.npmjs.org;
      proxy_ssl_server_name on;
      proxy_cache deps;
      proxy_cache_valid 200 1d;
    }
    location = /health { return 200 "ok\n"; }
    location / { return 403; }
  }
}
