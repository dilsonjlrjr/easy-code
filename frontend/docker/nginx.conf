server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Security headers (ADR-19, ESP-11 ER-11-2): Content-Security-Policy with a nonce per response,
    # frame-src only the content origin and frame-ancestors 'none'; nosniff, X-Frame-Options and
    # Referrer-Policy. Written at container start by 40-write-runtime-config.sh. A location with its
    # own add_header drops the server ones, so every location includes the file.
    include /etc/nginx/conf.d/security-headers.inc;

    # Hashed bundles never change; cache them for a long time.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Runtime configuration must always be fresh.
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Single-page application: unknown paths fall back to index.html. The build marks every script
    # and style of index.html with the __CSP_NONCE__ placeholder (vite html.cspNonce); nginx puts the
    # nonce of this response in its place. no-store, so a cached page never carries an old nonce.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
        sub_filter_once off;
        sub_filter "__CSP_NONCE__" $request_id;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API (openapi `servers: /api/v1`, no CORS): /api/ goes to the api service. The
    # variable plus Docker's resolver lets nginx start before the api is up and follow its address.
    # The event stream (sse.md 9) needs no buffering, no proxy compression and a long read timeout.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
