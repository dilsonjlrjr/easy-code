      scanners: []
      network: none
    limits: { cpu: 2, memory_mib: 4096, disk_mib: 4096, command_time: PT15M, provisional: true }
    prohibitions:
      - Tomar decisão humana (aprovar gate humano, aceitar risco, decidir escalonamento, mudar escopo, publicar em produção).
