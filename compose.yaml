# Local development stack for Easy Code (ADR-16 describes production).
# Usage: docker compose up --build   (web on http://localhost:8080, api on http://localhost:8081)
#
# Development shortcuts, not for production:
# - every service connects as the database superuser; production uses the per-process roles
#   that the first migration creates (ADR-18);
# - no reverse proxy or TLS yet: Keycloak (start-dev, in-memory H2, realm imported from
#   infra/keycloak/easycode-realm.json) is published on http://localhost:8180/auth; the api reaches it
#   as http://keycloak:8080/auth (backchannel). Every secret and password here is a DEV ONLY value,
#   public in the repository: dev users admin.dev (administrator), lead.dev, approver.dev,
#   member.dev and disabled.dev (account disabled), all with password "dev-only-password". Project
#   roles are given in the platform (US-02), not in Keycloak;
# - easycode-gateway has no network (the egress proxy of ADR-16 is not in the stack yet), so it serves
#   the deterministic fake under the names "anthropic" and "openai" (EASYCODE_GATEWAY_PROVIDERS=
#   anthropic=fake,openai=fake): any key but "invalid" passes the test. The override files
#   compose.anthropic.yaml and compose.openai.yaml give the gateway a route out and the real adapter;
# - gateway-keys creates the platform key pair once (ADR-13): the private key only in the gateway
#   volume, the public key in the volume the api reads.
# - easycode-sandbox (ADR-05/06) mounts the host Docker socket and runs each agent command in a hardened
#   container without network. Set EASYCODE_DOCKER_GID to the group of /var/run/docker.sock on the host
#   (stat -c %g /var/run/docker.sock). The workspace disk limit is a size-limited tmpfs: this stack has no
#   XFS prjquota volume (ADR-05 v2 asks for one in production) and no userns-remap in the daemon.
# - deps-proxy caches the Go module proxy and npm for the dependency action only (ADR-07); sandbox
#   containers of that action join the internal network easycode-dependencies, whose only other member
#   is deps-proxy.
# - the git clone of a project (US-42) is served by the api at http://localhost:8081/git/<project>.git
#   (HTTP Basic, any user, the session token as the password).
# - Claude Code as the agent executor (ADR-23): set EASYCODE_CLAUDE_CODE_BIN to the host path of the binary
#   (readlink -f "$(command -v claude)"); empty turns it off. The volume easycode-agent-proxy holds the wave
#   model proxy sockets of the worker and the agent bridge easycode-sandbox installs in bin/; both run as
#   uid 65532 and the sandbox containers (uid 10001) only read bin/ and connect to the sockets.

name: easycode

# Keycloak realm of the development stack (ADR-12). DEV ONLY values; production mounts the
# secrets as files (EASYCODE_*_FILE, ARQ section 8.1).
x-sso: &sso
  EASYCODE_OIDC_ISSUER: ${EASYCODE_OIDC_ISSUER:-http://localhost:8180/auth/realms/easycode}
  EASYCODE_OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/easycode
  EASYCODE_ORGANIZATION_NAME: ${EASYCODE_ORGANIZATION_NAME:-Easy Code (desenvolvimento)}

x-backend: &backend
  build:
    context: ./backend
  environment: &backend-env
    EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
    EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: easycode
      POSTGRES_PASSWORD: easycode
      POSTGRES_DB: easycode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-boot init the image runs a socket-only server, which would pass a socket check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U easycode -d easycode"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SSO of the development stack (ADR-12). Pinned by tag and digest (ADR-16).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-only-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${EASYCODE_SSO_PUBLIC_URL:-http://localhost:8180/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image has no curl: plain HTTP over bash on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      # start-dev builds the server on first boot (minutes on a slow host).
      start_period: 15m

  migrate:
    build:
      context: ./backend
      args:
        BINARY: easycode-api
        VERSION: ${EASYCODE_VERSION:-dev}
    command: ["migrate"]
    environment:
      <<: *sso
      EASYCODE_MIGRATION_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway-keys:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
        VERSION: ${EASYCODE_VERSION:-dev}
    command: ["keygen", "/run/easycode-gateway-key/private.pem", "/run/easycode-sealing/public.pem"]
    volumes:
      - gateway-key:/run/easycode-gateway-key
      - sealing-public:/run/easycode-sealing
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
      target: runtime-git
      args:
        BINARY: easycode-api
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      <<: [*backend-env, *sso]
      EASYCODE_HTTP_ADDR: ":8080"
      EASYCODE_GIT_BASE_URL: ${EASYCODE_GIT_BASE_URL:-http://localhost:8081}
      # Content origin of the prototypes (ADR-19): own listener, no /api, no cookie. 127.0.0.1 is another
      # host than localhost for the browser, so the platform cookie never reaches it.
      EASYCODE_CONTENT_ADDR: ":8082"
      EASYCODE_CONTENT_ORIGIN: ${EASYCODE_CONTENT_ORIGIN:-http://127.0.0.1:8082}
      EASYCODE_PUBLIC_ORIGIN: ${EASYCODE_PUBLIC_ORIGIN:-http://localhost:8080}
      EASYCODE_SEALING_PUBLIC_KEY_FILE: /run/easycode-sealing/public.pem
      EASYCODE_OIDC_CLIENT_ID: easycode-api
      EASYCODE_OIDC_CLIENT_SECRET: dev-only-easycode-api-secret
      EASYCODE_SESSION_SECRET: dev-only-session-key-not-for-production-0001
    volumes:
      - sealing-public:/run/easycode-sealing:ro
      - repos:/var/lib/easycode/repos:ro
      - files:/var/lib/easycode/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-keys:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8082:8082"

  worker:
    <<: *backend
    build:
      context: ./backend
      target: runtime-git
      args:
        BINARY: easycode-worker
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      <<: [*backend-env, *sso]
      EASYCODE_SSO_EVENTS_CLIENT_ID: easycode-events
      EASYCODE_SSO_EVENTS_CLIENT_SECRET: dev-only-easycode-events-secret
      EASYCODE_SANDBOX_IMAGE: go
    volumes:
      - gateway-socket:/run/easycode-gateway
      - sandbox-socket:/run/easycode-sandbox
      - agent-proxy:/run/easycode-agent-proxy
      - repos:/var/lib/easycode/repos
      - files:/var/lib/easycode/files:ro

  # Go sandbox image with the warm build cache (ADR-07); built once, never runs a service.
  sandbox-go-image:
    build:
      context: ./infra/sandbox/go
    image: easycode-sandbox-go:dev
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # Security scan image (US-23): Opengrep, Trivy and Gitleaks at fixed versions with their offline rules and
  # vulnerability database (about 2.3 GB); the worker asks for it only for the scanner category.
  sandbox-security-image:
    build:
      context: ./infra/sandbox/security
    image: easycode-sandbox-security:dev
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # Only process with the Docker socket (ADR-06). No network: it serves the worker over a Unix socket.
  sandbox:
    build:
      context: ./backend
      args:
        BINARY: easycode-sandbox
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
      EASYCODE_SANDBOX_IMAGES: go=easycode-sandbox-go:dev,security=easycode-sandbox-security:dev
      EASYCODE_SANDBOX_RUNTIME: runc
      EASYCODE_SANDBOX_DEPENDENCIES_NETWORK: easycode-dependencies
      EASYCODE_SANDBOX_DEPENDENCIES_PROXY: http://deps-proxy:8080
      EASYCODE_CLAUDE_CODE_BIN: ${EASYCODE_CLAUDE_CODE_BIN:-}
      EASYCODE_AGENT_PROXY_VOLUME: easycode-agent-proxy
    network_mode: none
    group_add:
      - "${EASYCODE_DOCKER_GID:-990}"
    volumes:
      - ${EASYCODE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - sandbox-socket:/run/easycode-sandbox
      - agent-proxy:/run/easycode-agent-proxy
    depends_on:
      sandbox-go-image:
        condition: service_completed_successfully
      sandbox-security-image:
        condition: service_completed_successfully

  # Package cache of the dependency action (ADR-07): internal network with the sandbox containers of
  # that action, exit only to proxy.golang.org and registry.npmjs.org.
  deps-proxy:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    volumes:
      - ./infra/deps-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - deps-cache:/var/cache/nginx
    networks:
      - dependencies
      - deps-output

  # Only process that opens provider keys (S-03). Until Onda 1 it serves the deterministic fake
  # provider; no database, no network beyond the socket shared with the worker.
  gateway:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
        VERSION: ${EASYCODE_VERSION:-dev}
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
      EASYCODE_GATEWAY_PROVIDERS: ${EASYCODE_GATEWAY_PROVIDERS:-anthropic=fake,openai=fake}
      EASYCODE_GATEWAY_PRIVATE_KEY_FILE: /run/easycode-gateway-key/private.pem
    network_mode: none
    volumes:
      - gateway-socket:/run/easycode-gateway
      - gateway-key:/run/easycode-gateway-key:ro
    depends_on:
      gateway-keys:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: /api/v1
      # ADR-19 / ER-11-2: the SPA frames only the content origin (Content-Security-Policy frame-src).
      EASYCODE_CONTENT_ORIGIN: ${EASYCODE_CONTENT_ORIGIN:-http://127.0.0.1:8082}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

  # Daily backup (RNF-11: RPO 24 h; ADR-16 v2, PERSIST.md backup): pg_dump of the database and a copy of the
  # project repositories and of the files volume into the backups volume, kept 30 days. Opt-in in development: docker compose --profile
  # backup up backup. Production points the destination outside the server and connects as easycode_backup.
  # Restore: infra/backup/restore.sh <run folder> (tested by TestRecoveryFromBackup in the backend CI).
  backup:
    image: postgres:17.6-bookworm
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: easycode
      PGPASSWORD: easycode # DEV ONLY
      PGDATABASE: easycode
      EASYCODE_REPOS_DIR: /var/lib/easycode/repos
      EASYCODE_FILES_DIR: /var/lib/easycode/files
      EASYCODE_BACKUP_RETENTION_DAYS: "30"
    volumes:
      - ./infra/backup:/opt/easycode-backup:ro
      - repos:/var/lib/easycode/repos:ro
      - files:/var/lib/easycode/files:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do sh /opt/easycode-backup/backup.sh /backups; sleep 86400; done"]

volumes:
  postgres-data:
  gateway-socket:
  gateway-key:
  sealing-public:
  sandbox-socket:
  # Named without the project prefix: easycode-sandbox mounts its subdirectories in the agent session
  # containers by this name (EASYCODE_AGENT_PROXY_VOLUME).
  agent-proxy:
    name: easycode-agent-proxy
  repos:
  files:
  deps-cache:
  backups:

networks:
  default: {}
  dependencies:
    name: easycode-dependencies
    internal: true
  deps-output: {}
