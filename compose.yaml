# Local development stack for Easy Code (ADR-16 describes production).
# Usage: docker compose up --build   (web on http://localhost:8080, api on http://localhost:8081)
#
# Development shortcuts, not for production:
# - every service connects as the database superuser; production uses the per-process roles
#   that the first migration creates (ADR-18);
# - no reverse proxy or TLS yet: Keycloak (start-dev, in-memory H2, realm imported from
#   infra/keycloak/easycode-realm.json) is published on http://localhost:8180/auth; the api reaches it
#   as http://keycloak:8080/auth (backchannel). Every secret and password here is a DEV ONLY value,
#   public in the repository: dev users admin.dev (administrator), lead.dev, approver.dev,
#   member.dev and disabled.dev (account disabled), all with password "dev-only-password". Project
#   roles are given in the platform (US-02), not in Keycloak;
# - easycode-gateway has no network (the egress proxy of ADR-16 is not in the stack yet), so it serves
#   the deterministic fake under the name "anthropic" (EASYCODE_GATEWAY_PROVIDERS=anthropic=fake): any key
#   but "invalid" passes the test. Set EASYCODE_GATEWAY_PROVIDERS=anthropic and give the gateway a route
#   to api.anthropic.com (override file) to use the real adapter;
# - gateway-keys creates the platform key pair once (ADR-13): the private key only in the gateway
#   volume, the public key in the volume the api reads.

name: easycode

# Keycloak realm of the development stack (ADR-12). DEV ONLY values; production mounts the
# secrets as files (EASYCODE_*_FILE, ARQ section 8.1).
x-sso: &sso
  EASYCODE_OIDC_ISSUER: ${EASYCODE_OIDC_ISSUER:-http://localhost:8180/auth/realms/easycode}
  EASYCODE_OIDC_INTERNAL_URL: http://keycloak:8080/auth/realms/easycode
  EASYCODE_ORGANIZATION_NAME: ${EASYCODE_ORGANIZATION_NAME:-Easy Code (desenvolvimento)}

x-backend: &backend
  build:
    context: ./backend
  environment: &backend-env
    EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
    EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: easycode
      POSTGRES_PASSWORD: easycode
      POSTGRES_DB: easycode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-boot init the image runs a socket-only server, which would pass a socket check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U easycode -d easycode"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SSO of the development stack (ADR-12). Pinned by tag and digest (ADR-16).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: dev-only-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only-admin-password
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${EASYCODE_SSO_PUBLIC_URL:-http://localhost:8180/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      # The image has no curl: plain HTTP over bash on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      # start-dev builds the server on first boot (minutes on a slow host).
      start_period: 15m

  migrate:
    build:
      context: ./backend
      args:
        BINARY: easycode-api
    command: ["migrate"]
    environment:
      <<: *sso
      EASYCODE_MIGRATION_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway-keys:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
    command: ["keygen", "/run/easycode-gateway-key/private.pem", "/run/easycode-sealing/public.pem"]
    volumes:
      - gateway-key:/run/easycode-gateway-key
      - sealing-public:/run/easycode-sealing
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
      args:
        BINARY: easycode-api
    environment:
      <<: [*backend-env, *sso]
      EASYCODE_HTTP_ADDR: ":8080"
      EASYCODE_PUBLIC_ORIGIN: ${EASYCODE_PUBLIC_ORIGIN:-http://localhost:8080}
      EASYCODE_SEALING_PUBLIC_KEY_FILE: /run/easycode-sealing/public.pem
      EASYCODE_OIDC_CLIENT_ID: easycode-api
      EASYCODE_OIDC_CLIENT_SECRET: dev-only-easycode-api-secret
      EASYCODE_SESSION_SECRET: dev-only-session-key-not-for-production-0001
    volumes:
      - sealing-public:/run/easycode-sealing:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-keys:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  worker:
    <<: *backend
    build:
      context: ./backend
      args:
        BINARY: easycode-worker
    environment:
      <<: [*backend-env, *sso]
      EASYCODE_SSO_EVENTS_CLIENT_ID: easycode-events
      EASYCODE_SSO_EVENTS_CLIENT_SECRET: dev-only-easycode-events-secret
    volumes:
      - gateway-socket:/run/easycode-gateway

  # Only process that opens provider keys (S-03). Until Onda 1 it serves the deterministic fake
  # provider; no database, no network beyond the socket shared with the worker.
  gateway:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
      EASYCODE_GATEWAY_PROVIDERS: ${EASYCODE_GATEWAY_PROVIDERS:-anthropic=fake}
      EASYCODE_GATEWAY_PRIVATE_KEY_FILE: /run/easycode-gateway-key/private.pem
    network_mode: none
    volumes:
      - gateway-socket:/run/easycode-gateway
      - gateway-key:/run/easycode-gateway-key:ro
    depends_on:
      gateway-keys:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  gateway-socket:
  gateway-key:
  sealing-public:
