# Local development stack for Easy Code (ADR-16 describes production).
# Usage: docker compose up --build   (web on http://localhost:8080, api on http://localhost:8081)
#
# Development shortcuts, not for production:
# - every service connects as the database superuser; production uses the per-process roles
#   that the first migration creates (ADR-18);
# - no reverse proxy, TLS or Keycloak yet: the api runs the marco1 profile, with the fixed development
#   identity (user "dev", administrator, lead and approver of the projects it creates) and its session
#   cookie issued by POST /api/v1/dev/session (ADR-12; outside openapi.yaml, refused outside marco1);
# - easycode-gateway has no network (the egress proxy of ADR-16 is not in the stack yet), so it serves
#   the deterministic fake under the name "anthropic" (EASYCODE_GATEWAY_PROVIDERS=anthropic=fake): any key
#   but "invalid" passes the test. Set EASYCODE_GATEWAY_PROVIDERS=anthropic and give the gateway a route
#   to api.anthropic.com (override file) to use the real adapter;
# - gateway-keys creates the platform key pair once (ADR-13): the private key only in the gateway
#   volume, the public key in the volume the api reads.

name: easycode

# Fixed development identity of the marco1 profile (ADR-12). The secret only signs dev cookies.
x-marco1: &marco1
  EASYCODE_PROFILE: marco1
  EASYCODE_DEV_USER_SUB: ${EASYCODE_DEV_USER_SUB:-dev}
  EASYCODE_DEV_USER_NAME: ${EASYCODE_DEV_USER_NAME:-Dev}
  EASYCODE_DEV_SESSION_SECRET: ${EASYCODE_DEV_SESSION_SECRET:-marco1-development-only-session-secret}

x-backend: &backend
  build:
    context: ./backend
  environment: &backend-env
    EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
    EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: easycode
      POSTGRES_PASSWORD: easycode
      POSTGRES_DB: easycode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-boot init the image runs a socket-only server, which would pass a socket check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U easycode -d easycode"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./backend
      args:
        BINARY: easycode-api
    command: ["migrate"]
    environment:
      <<: *marco1
      EASYCODE_MIGRATION_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_DATABASE_URL: postgres://easycode:easycode@postgres:5432/easycode?sslmode=disable
      EASYCODE_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway-keys:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
    command: ["keygen", "/run/easycode-gateway-key/private.pem", "/run/easycode-sealing/public.pem"]
    volumes:
      - gateway-key:/run/easycode-gateway-key
      - sealing-public:/run/easycode-sealing
    restart: "no"

  api:
    <<: *backend
    build:
      context: ./backend
      args:
        BINARY: easycode-api
    environment:
      <<: [*backend-env, *marco1]
      EASYCODE_HTTP_ADDR: ":8080"
      EASYCODE_PUBLIC_ORIGIN: ${EASYCODE_PUBLIC_ORIGIN:-http://localhost:8080}
      EASYCODE_SEALING_PUBLIC_KEY_FILE: /run/easycode-sealing/public.pem
    volumes:
      - sealing-public:/run/easycode-sealing:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway-keys:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8080"

  worker:
    <<: *backend
    build:
      context: ./backend
      args:
        BINARY: easycode-worker
    volumes:
      - gateway-socket:/run/easycode-gateway

  # Only process that opens provider keys (S-03). Until Onda 1 it serves the deterministic fake
  # provider; no database, no network beyond the socket shared with the worker.
  gateway:
    build:
      context: ./backend
      args:
        BINARY: easycode-gateway
    environment:
      EASYCODE_LOG_LEVEL: ${EASYCODE_LOG_LEVEL:-debug}
      EASYCODE_GATEWAY_PROVIDERS: ${EASYCODE_GATEWAY_PROVIDERS:-anthropic=fake}
      EASYCODE_GATEWAY_PRIVATE_KEY_FILE: /run/easycode-gateway-key/private.pem
    network_mode: none
    volumes:
      - gateway-socket:/run/easycode-gateway
      - gateway-key:/run/easycode-gateway-key:ro
    depends_on:
      gateway-keys:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: http://localhost:8081/api/v1
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  gateway-socket:
  gateway-key:
  sealing-public:
